<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News & Fun · Klumpe Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="container">
  <header class="page-head">
    <div class="eyebrow">News & Fun</div>
    <h1>What's happening in the lab</h1>
    <p class="lead">Papers, people, prizes — and the occasional cake.</p>
  </header>

  <div class="filter-row">
    <button class="chip" data-newsfilter="all" aria-pressed="true">Everything</button>
    <button class="chip" data-newsfilter="news" aria-pressed="false">News</button>
    <button class="chip" data-newsfilter="fun" aria-pressed="false">Fun</button>
  </div>

  <div id="news-list"></div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
