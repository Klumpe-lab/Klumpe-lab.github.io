<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications · Klumpe Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="container">
  <header class="page-head">
    <div class="eyebrow">Publications</div>
    <h1>Papers & preprints</h1>
    <p class="lead">Also on <a href="https://scholar.google.com/citations?user=0xs-E9wAAAAJ&amp;hl=en" rel="noopener">Google Scholar</a> and <a href="https://orcid.org/0000-0002-8350-6503" rel="noopener">ORCID</a>.</p>
  </header>

  <div class="pub-tools">
    <input type="search" id="pub-search" placeholder="Search title, author or journal…" aria-label="Search publications">
    <button class="chip" data-pubfilter="all" aria-pressed="true">All</button>
    <button class="chip" data-pubfilter="article" aria-pressed="false">Articles</button>
    <button class="chip" data-pubfilter="preprint" aria-pressed="false">Preprints</button>
    <button class="chip" data-pubfilter="review" aria-pressed="false">Reviews</button>
    <button class="chip" data-pubfilter="other" aria-pressed="false">Chapters &amp; patents</button>
  </div>

  <div id="pub-list"></div>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
